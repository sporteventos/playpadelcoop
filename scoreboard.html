<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00C37B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Scoreboard — Play Padel 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style>
    :root {
      --verde:#00C37B; --preto:#0A0F0D; --preto-card:#111815; --preto-borda:#1C2620;
      --cinza-escuro:#1E2922; --cinza-texto:#8AA396; --branco:#F0F7F3;
      --amarelo:#F5C518; --vermelho:#FF4A4A; --verde-neon:#39FF8F;
      --azul:#4A9EFF; --roxo:#C97BFF;
      --radius:10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--preto); color: var(--branco); min-height: 100vh; }

    /* â”€â”€ TOP BAR â”€â”€ */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1.5rem; background: var(--preto-card);
      border-bottom: 1px solid var(--preto-borda); position: sticky; top: 0; z-index: 50;
      gap: 1rem;
    }
    .top-bar-left { display: flex; flex-direction: column; }
    .top-bar-logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.4rem; color: var(--verde); letter-spacing: .04em; line-height: 1.1; }
    .top-bar-subtitle { font-size: .78rem; color: var(--cinza-texto); }
    .top-bar-right { display: flex; align-items: center; gap: .75rem; }
    .refresh-indicator { display: flex; align-items: center; gap: .4rem; font-size: .75rem; color: var(--cinza-texto); }
    .refresh-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--verde); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .refresh-countdown { font-weight: 700; color: var(--verde); min-width: 2.2rem; text-align: right; font-variant-numeric: tabular-nums; }
    .btn-refresh { background: none; border: 1px solid var(--preto-borda); border-radius: 6px; color: var(--cinza-texto); padding: .3rem .65rem; font-size: .75rem; cursor: pointer; display: flex; align-items: center; gap: .35rem; transition: all .15s; }
    .btn-refresh:hover { border-color: var(--verde); color: var(--verde); }
    .live-badge { font-size: .58rem; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; background: var(--vermelho); color: #fff; padding: .15rem .45rem; border-radius: 4px; animation: livepulse 1.5s infinite; }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* â”€â”€ PROGRESS BAR â”€â”€ */
    .progress-bar-wrap { padding: .6rem 1.5rem; background: var(--preto-card); border-bottom: 1px solid var(--preto-borda); }
    .progress-meta { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; color: var(--cinza-texto); margin-bottom: .35rem; }
    .progress-meta strong { color: var(--branco); }
    .progress-track { height: 4px; background: var(--preto-borda); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--verde), var(--verde-neon)); border-radius: 2px; transition: width .6s ease; }

    /* â”€â”€ TABS â”€â”€ */
    .cat-tabs { display: flex; gap: .35rem; padding: .6rem 1.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--preto-borda); background: var(--preto-card); }
    .cat-tab { padding: .3rem .75rem; border-radius: 6px; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; background: var(--cinza-escuro); color: var(--cinza-texto); border: none; transition: all .15s; }
    .cat-tab:hover { color: var(--branco); background: rgba(0,195,123,.15); }
    .cat-tab.active { background: var(--verde); color: #000; }

    /* â”€â”€ CONTENT â”€â”€ */
    .content { padding: 1.25rem 1.5rem; }
    .cat-section { display: none; }
    .cat-section.active { display: block; }

    /* â”€â”€ CAT STATS CHIPS â”€â”€ */
    .cat-chips { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .chip { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .7rem; border-radius: 20px; font-size: .72rem; font-weight: 600; }
    .chip-verde  { background: rgba(0,195,123,.15);  color: var(--verde);  border: 1px solid rgba(0,195,123,.3); }
    .chip-amarelo{ background: rgba(245,197,24,.15); color: var(--amarelo);border: 1px solid rgba(245,197,24,.3); }
    .chip-azul   { background: rgba(74,158,255,.15); color: var(--azul);   border: 1px solid rgba(74,158,255,.3); }
    .chip-cinza  { background: rgba(138,163,150,.1); color: var(--cinza-texto); border: 1px solid rgba(138,163,150,.2); }
    .chip-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* â”€â”€ SECTION HEADINGS â”€â”€ */
    .section-heading {
      font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase; color: var(--cinza-texto);
      margin-bottom: .75rem; display: flex; align-items: center; gap: .5rem;
    }
    .section-heading i { font-size: 1.1rem; }

    /* â”€â”€ QUALIFIED PANEL â”€â”€ */
    .qualified-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .5rem; margin-bottom: 1.5rem; }
    .qual-card { background: var(--preto-card); border: 1px solid var(--preto-borda); border-radius: 8px; padding: .55rem .85rem; display: flex; align-items: center; gap: .6rem; }
    .qual-card.q-direto  { border-left: 3px solid var(--verde); }
    .qual-card.q-wildcard{ border-left: 3px solid var(--amarelo); }
    .qual-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .qual-dot-verde  { background: var(--verde); }
    .qual-dot-amarelo{ background: var(--amarelo); }
    .qual-name { font-size: .78rem; font-weight: 600; color: var(--branco); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qual-from { font-size: .65rem; color: var(--cinza-texto); flex-shrink: 0; }
    .qual-badge-sm { font-size: .58rem; font-weight: 700; padding: .1rem .35rem; border-radius: 4px; flex-shrink: 0; }
    .qual-badge-direto   { background: rgba(0,195,123,.2);  color: var(--verde); }
    .qual-badge-wildcard { background: rgba(245,197,24,.2); color: var(--amarelo); }
    .qual-empty { color: var(--cinza-texto); font-size: .82rem; padding: .75rem 0; }

    /* â”€â”€ RECENT RESULTS â”€â”€ */
    .results-list { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1.5rem; }
    .result-row { background: var(--preto-card); border: 1px solid var(--preto-borda); border-radius: 8px; padding: .5rem .85rem; display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; gap: .5rem; font-size: .75rem; }
    .result-group-tag { font-size: .62rem; font-weight: 700; padding: .1rem .35rem; border-radius: 4px; background: var(--cinza-escuro); color: var(--cinza-texto); white-space: nowrap; }
    .result-team { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-team.winner { color: var(--branco); font-weight: 600; }
    .result-team.loser  { color: var(--cinza-texto); }
    .result-team.right  { text-align: right; }
    .result-score { font-family: 'Barlow Condensed', sans-serif; font-size: .9rem; font-weight: 700; color: var(--verde); white-space: nowrap; text-align: center; min-width: 60px; }

    /* â”€â”€ DECISIVE GAMES â”€â”€ */
    .decisive-list { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1.5rem; }
    .decisive-row { background: var(--preto-card); border: 1px solid rgba(245,197,24,.25); border-radius: 8px; padding: .55rem .85rem; display: flex; align-items: center; gap: .65rem; font-size: .75rem; }
    .decisive-tag { font-size: .62rem; font-weight: 700; padding: .1rem .35rem; border-radius: 4px; background: rgba(245,197,24,.15); color: var(--amarelo); white-space: nowrap; }
    .decisive-teams { flex: 1; color: var(--branco); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .decisive-time { font-size: .68rem; color: var(--cinza-texto); white-space: nowrap; }
    .decisive-field { font-size: .65rem; color: var(--cinza-texto); }

    /* â”€â”€ GROUPS GRID â”€â”€ */
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .group-card { background: var(--preto-card); border: 1px solid var(--preto-borda); border-radius: var(--radius); overflow: hidden; }
    .group-card-header { display: flex; align-items: center; justify-content: space-between; padding: .55rem 1rem; border-bottom: 1px solid var(--preto-borda); }
    .group-card-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; }
    .group-card-meta { display: flex; align-items: center; gap: .5rem; }
    .group-progress-txt { font-size: .65rem; color: var(--cinza-texto); }
    .badge-decided { font-size: .6rem; font-weight: 700; padding: .1rem .4rem; border-radius: 4px; background: rgba(0,195,123,.2); color: var(--verde); }
    .badge-live    { font-size: .6rem; font-weight: 700; padding: .1rem .4rem; border-radius: 4px; background: rgba(74,158,255,.2); color: var(--azul); animation: livepulse 2s infinite; }
    .std-table { width: 100%; border-collapse: collapse; font-size: .74rem; }
    .std-table th { padding: .3rem .5rem; color: var(--cinza-texto); font-weight: 600; text-align: right; border-bottom: 1px solid var(--preto-borda); font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; }
    .std-table th:nth-child(2) { text-align: left; }
    .std-table td { padding: .36rem .5rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,.04); }
    .std-table td:nth-child(2) { text-align: left; }
    .std-table tr:last-child td { border-bottom: none; }
    .status-col { width: 8px; padding: .36rem .35rem .36rem .5rem; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot-verde   { background: var(--verde); }
    .dot-amarelo { background: var(--amarelo); }
    .dot-azul    { background: var(--azul); }
    .dot-cinza   { background: var(--cinza-escuro); }
    .pair-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

    /* â”€â”€ LAST UPDATE â”€â”€ */
    .footer-bar { text-align: center; padding: 1.25rem; font-size: .72rem; color: var(--cinza-texto); border-top: 1px solid var(--preto-borda); margin-top: 1.5rem; }

    /* â”€â”€ EMPTY â”€â”€ */
    .empty-box { text-align: center; padding: 2rem; color: var(--cinza-texto); font-size: .82rem; }

    /* â”€â”€ MOBILE â”€â”€ */
    @media (max-width: 640px) {
      .top-bar { padding: .6rem 1rem; flex-wrap: wrap; }
      .cat-tabs { padding: .5rem 1rem; gap: .3rem; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .cat-tabs::-webkit-scrollbar { display: none; }
      .cat-tab { flex-shrink: 0; font-size: .72rem; padding: .28rem .65rem; }
      .content { padding: .85rem .75rem; }
      .groups-grid { grid-template-columns: 1fr; }
      .qualified-grid { grid-template-columns: 1fr 1fr; }
      .result-row { grid-template-columns: auto 1fr auto 1fr; font-size: .7rem; }
      .result-row > .result-group-tag { display: none; }
      .progress-bar-wrap { padding: .5rem 1rem; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-left">
    <div class="top-bar-logo">PLAY PADEL <span style="color:var(--branco);font-weight:400">2026</span></div>
    <div class="top-bar-subtitle">Scoreboard ao Vivo · Maputo</div>
  </div>
  <div class="top-bar-right">
    <button class="btn-refresh" onclick="forceRefresh()"><i class="ph ph-arrows-clockwise"></i> Actualizar</button>
    <div class="refresh-indicator">
      <div class="refresh-dot"></div>
      <span>em&nbsp;<span class="refresh-countdown" id="refreshCountdown">15:00</span></span>
    </div>
    <span class="live-badge">LIVE</span>
  </div>
</div>

<!-- PROGRESS BAR -->
<div class="progress-bar-wrap">
  <div class="progress-meta">
    <span><strong id="progDone">0</strong> / <strong id="progTotal">0</strong> jogos disputados</span>
    <span id="progGroups" style="color:var(--cinza-texto)"></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<!-- TABS -->
<div class="cat-tabs" id="catTabs"></div>

<!-- CONTENT -->
<div class="content" id="mainContent"></div>

<div class="footer-bar">Última actualização: <span id="lastUpdate">—</span></div>

<script src="js/data.js"></script>
<script>
  function ppLoad(k) { try { return JSON.parse(localStorage.getItem('pp_' + k)); } catch(e) { return null; } }
  function getData(k) {
    const s = ppLoad(k);
    if (s !== null) return s;
    return typeof INITIAL_DATA !== 'undefined' ? (INITIAL_DATA[k] || []) : [];
  }

  const CATS = ['M1','M2','M3','M4','M5','F1','F2'];
  const WILDCARD_CATS = new Set(['M1','F1','M2','F2']);
  const CAT_CLR = { M1:'#4A9EFF', M2:'#00C37B', M3:'#39FF8F', M4:'#F5C518', M5:'#FF9A3C', F1:'#FF6BB0', F2:'#C97BFF' };

  // â”€â”€ Standings â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function computeStandings(grupo, jogos) {
    const gJogos = jogos.filter(j => j.grupo === grupo.id);
    const table  = {};
    gJogos.forEach(j => {
      if (!table[j.eq1]) table[j.eq1] = { par:j.eq1, pj:0, v:0, d:0, sv:0, sl:0, gv:0, gl:0 };
      if (!table[j.eq2]) table[j.eq2] = { par:j.eq2, pj:0, v:0, d:0, sv:0, sl:0, gv:0, gl:0 };
    });
    gJogos.forEach(j => {
      if (!j.resultado) return;
      const r = j.resultado;
      if (r.wo) {
        const win = r.wo === 'eq1' ? j.eq1 : j.eq2, los = r.wo === 'eq1' ? j.eq2 : j.eq1;
        if (table[win]) { table[win].pj++; table[win].v++; }
        if (table[los]) { table[los].pj++;  table[los].d++;  }
        return;
      }
      const sets = [[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].filter(([a,b])=>a!=null&&b!=null);
      let ve1=0,ve2=0,gv1=0,gl1=0,gv2=0,gl2=0,sv1=0,sl1=0,sv2=0,sl2=0;
      sets.forEach(([a,b])=>{ if(a>b){ve1++;sv1++;sl2++;}else{ve2++;sv2++;sl1++;} gv1+=a;gl1+=b;gv2+=b;gl2+=a; });
      const w1 = ve1 > ve2;
      if(table[j.eq1]){table[j.eq1].pj++;table[j.eq1].sv+=sv1;table[j.eq1].sl+=sl1;table[j.eq1].gv+=gv1;table[j.eq1].gl+=gl1;if(w1)table[j.eq1].v++;else table[j.eq1].d++;}
      if(table[j.eq2]){table[j.eq2].pj++;table[j.eq2].sv+=sv2;table[j.eq2].sl+=sl2;table[j.eq2].gv+=gv2;table[j.eq2].gl+=gl2;if(!w1)table[j.eq2].v++;else table[j.eq2].d++;}
    });
    return Object.values(table).sort((a,b)=>b.v-a.v||(b.sv-b.sl)-(a.sv-a.sl)||(b.gv-b.gl)-(a.gv-a.gl)||b.gv-a.gv);
  }

  // â”€â”€ Determine qualification status for a category â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function getQualified(cat, grupos, jogos) {
    const catGrupos = grupos.filter(g => g.cat === cat);
    const hasWc     = WILDCARD_CATS.has(cat);
    const allData   = catGrupos.map(g => ({ g, rows: computeStandings(g, jogos) }));

    const qualified = new Map(); // par -> { type:'direto'|'wildcard', group }
    allData.forEach(({g, rows}) => {
      if (rows[0]?.pj > 0) qualified.set(rows[0].par, { type:'direto', group: g.id });
      if (rows[1]?.pj > 0) qualified.set(rows[1].par, { type:'direto', group: g.id });
    });

    if (hasWc) {
      const thirds = allData
        .filter(({rows}) => rows[2]?.pj > 0)
        .map(({g, rows}) => ({ ...rows[2], group: g.id }))
        .sort((a,b) => b.v-a.v||(b.sv-b.sl)-(a.sv-a.sl)||(b.gv-b.gl)-(a.gv-a.gl)||b.gv-a.gv);
      thirds.slice(0,2).forEach(t => { if (!qualified.has(t.par)) qualified.set(t.par, { type:'wildcard', group: t.group }); });
    }
    return qualified;
  }

  // â”€â”€ Check if a group is fully decided (top 2 are mathematically confirmed) â”€
  function isGroupDecided(rows, totalGames) {
    if (!rows[1] || rows[1].pj === 0) return false;
    const remaining = totalGames - rows.reduce((s,r)=>s+r.pj,0)/2;
    if (remaining === 0) return true;
    // Check if 3rd can no longer overtake 2nd
    if (rows.length < 3) return remaining === 0;
    const third = rows[2]; if (!third) return false;
    const maxPossibleWins = (third ? third.v + remaining : 0);
    return maxPossibleWins < rows[1].v;
  }

  // â”€â”€ Format score string â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function fmtScore(r) {
    if (!r) return '';
    if (r.wo) return 'W/O';
    const parts = [];
    [[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].forEach(([a,b]) => {
      if (a != null && b != null) parts.push(a+'-'+b);
    });
    return parts.join(' ');
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // â”€â”€ Build single group card â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function buildGroupCard(g, jogos, qualified) {
    const rows  = computeStandings(g, jogos);
    const gJogs = jogos.filter(j => j.grupo === g.id);
    const done  = gJogs.filter(j => j.resultado).length;
    const total = gJogs.length;
    const decided = isGroupDecided(rows, total);

    const headerBadge = decided
      ? '<span class="badge-decided">Decidido</span>'
      : (done > 0 ? '<span class="badge-live">Em curso</span>' : '');

    const rowsHtml = rows.map(r => {
      const q = qualified?.get(r.par);
      let dotCls = 'dot-cinza';
      if      (q?.type === 'direto')   dotCls = 'dot-verde';
      else if (q?.type === 'wildcard') dotCls = 'dot-amarelo';
      else if (r.pj < total / rows.length && r.pj > 0) dotCls = 'dot-azul'; // still playing
      else if (!q && r.pj > 0 && decided) dotCls = 'dot-cinza';
      else if (r.pj > 0) dotCls = 'dot-azul';
      return `<tr>
        <td class="status-col"><span class="status-dot ${dotCls}"></span></td>
        <td><span class="pair-name" title="${escHtml(r.par)}">${escHtml(r.par)}</span></td>
        <td>${r.pj}</td>
        <td style="color:var(--verde);font-weight:700">${r.v}</td>
        <td style="color:var(--vermelho)">${r.d}</td>
        <td>${r.sv}-${r.sl}</td>
        <td style="font-weight:700;color:var(--branco)">${r.gv}</td>
      </tr>`;
    }).join('');

    return `<div class="group-card">
      <div class="group-card-header">
        <span class="group-card-title" style="color:${CAT_CLR[g.cat]||'var(--branco)'}">${g.id}</span>
        <div class="group-card-meta">
          <span class="group-progress-txt">${done}/${total}</span>
          ${headerBadge}
        </div>
      </div>
      <table class="std-table">
        <thead><tr><th></th><th>Par</th><th>PJ</th><th>V</th><th>D</th><th>Sets</th><th>G</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  }

  // â”€â”€ Render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  let activeTab = 'TODOS';

  function renderAll() {
    const jogos  = getData('jogos');
    const grupos = getData('grupos');

    // â”€â”€ Progress bar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const groupJogos = jogos.filter(j => !j._isFF);
    const totalJ = groupJogos.length;
    const doneJ  = groupJogos.filter(j => j.resultado).length;
    const pct    = totalJ > 0 ? Math.round(doneJ / totalJ * 100) : 0;
    document.getElementById('progDone').textContent  = doneJ;
    document.getElementById('progTotal').textContent = totalJ;
    document.getElementById('progressFill').style.width = pct + '%';

    const decidedGroups = grupos.filter(g => {
      const gJ = groupJogos.filter(j => j.grupo === g.id);
      const rows = computeStandings(g, jogos);
      return isGroupDecided(rows, gJ.length);
    });
    const progGroupsEl = document.getElementById('progGroups');
    if (progGroupsEl) progGroupsEl.textContent = decidedGroups.length + '/' + grupos.length + ' grupos decididos';

    // â”€â”€ Build tabs â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const tabsEl = document.getElementById('catTabs');
    const allTabs = ['TODOS', ...CATS];
    tabsEl.innerHTML = allTabs.map(c => {
      const isActive = c === activeTab;
      return `<button class="cat-tab${isActive?' active':''}" onclick="switchTab('${c}',this)">${c === 'TODOS' ? 'Todos' : c}</button>`;
    }).join('');

    // â”€â”€ Build content sections â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const contentEl = document.getElementById('mainContent');
    let allHtml = '';

    // -- TODOS section --
    {
      const qualifiedAll = new Map();
      CATS.forEach(cat => {
        const qMap = getQualified(cat, grupos, jogos);
        qMap.forEach((v, k) => qualifiedAll.set(k, { ...v, cat }));
      });

      // Recently completed games (last 8)
      const recentResults = [...groupJogos]
        .filter(j => j.resultado)
        .sort((a,b) => {
          const da = (a.data||'') + (a.hora||''), db = (b.data||'') + (b.hora||'');
          return db.localeCompare(da);
        })
        .slice(0, 8);

      let recentHtml = '';
      if (recentResults.length > 0) {
        recentHtml = recentResults.map(j => {
          const r = j.resultado;
          const score = fmtScore(r);
          let w1 = true;
          if (r.wo) { w1 = r.wo !== 'eq1'; }
          else {
            const sets = [[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].filter(([a,b])=>a!=null&&b!=null);
            const s1 = sets.filter(([a,b])=>a>b).length, s2 = sets.filter(([a,b])=>b>a).length;
            w1 = s1 > s2;
          }
          return `<div class="result-row">
            <span class="result-group-tag">${escHtml(j.grupo)}</span>
            <span class="result-team ${w1?'winner':'loser'} right">${escHtml(j.eq1)}</span>
            <span class="result-score">${escHtml(score)}</span>
            <span class="result-team ${!w1?'winner':'loser'}">${escHtml(j.eq2)}</span>
          </div>`;
        }).join('');
      }

      // Decisive pending games (games where at least one team is still in contention)
      const decisiveGames = groupJogos.filter(j => {
        if (j.resultado) return false;
        const cat = j.grupo ? j.grupo.split('-')[0] : '';
        const q = getQualified(cat, grupos, jogos);
        // decisive if neither team is already confirmed qualified
        return !q.has(j.eq1) || !q.has(j.eq2);
      }).slice(0, 6);

      let decisiveHtml = '';
      if (decisiveGames.length > 0) {
        decisiveHtml = decisiveGames.map(j => {
          const timeStr = (j.data ? j.data.slice(5).replace('-','/') : '') + (j.hora ? ' ' + j.hora : '');
          return `<div class="decisive-row">
            <span class="decisive-tag">${escHtml(j.grupo)}</span>
            <span class="decisive-teams">${escHtml(j.eq1)} <span style="color:var(--cinza-texto);font-size:.65rem">vs</span> ${escHtml(j.eq2)}</span>
            ${j.campo ? `<span class="decisive-field"><i class="ph ph-map-pin"></i> ${escHtml(j.campo)}</span>` : ''}
            ${timeStr ? `<span class="decisive-time">${escHtml(timeStr)}</span>` : ''}
          </div>`;
        }).join('');
      }

      // Qualified panel
      const diretos   = [...qualifiedAll.entries()].filter(([,v])=>v.type==='direto');
      const wildcards = [...qualifiedAll.entries()].filter(([,v])=>v.type==='wildcard');

      let qualHtml = '';
      if (diretos.length === 0 && wildcards.length === 0) {
        qualHtml = `<div class="qual-empty"><i class="ph ph-clock"></i> Ainda nenhum par apurado.</div>`;
      } else {
        const cards = [...diretos, ...wildcards].map(([par, v]) =>
          `<div class="qual-card q-${v.type}">
            <span class="qual-dot qual-dot-${v.type === 'direto' ? 'verde' : 'amarelo'}"></span>
            <span class="qual-name" title="${escHtml(par)}">${escHtml(par)}</span>
            <span class="qual-from">${v.group}</span>
            <span class="qual-badge-sm qual-badge-${v.type}">${v.type === 'direto' ? 'Direto' : 'WC'}</span>
          </div>`
        ).join('');
        qualHtml = `<div class="qualified-grid">${cards}</div>`;
      }

      // Cat chips summary
      const catChipsHtml = CATS.map(cat => {
        const q = getQualified(cat, grupos, jogos);
        const catGrupos = grupos.filter(g => g.cat === cat);
        if (!catGrupos.length) return '';
        const total = catGrupos.reduce((s,g)=>s+computeStandings(g,jogos).length,0);
        const apurados = q.size;
        const pendentes = total - apurados;
        const clr = CAT_CLR[cat] || '#8AA396';
        return `<span class="chip" style="background:${clr}22;color:${clr};border:1px solid ${clr}44">
          <span class="chip-dot" style="background:${clr}"></span>${cat}
          <span style="opacity:.7;font-weight:400">${apurados} apurados</span>
        </span>`;
      }).filter(Boolean).join('');

      const todosContent = `
        <div class="cat-chips">${catChipsHtml}</div>

        ${qualHtml ? `<div class="section-heading"><i class="ph ph-trophy"></i> Já Apurados para a Fase Final</div>${qualHtml}` : ''}

        ${recentHtml ? `<div class="section-heading"><i class="ph ph-check-circle"></i> Últimos Resultados</div><div class="results-list">${recentHtml}</div>` : ''}

        ${decisiveHtml ? `<div class="section-heading"><i class="ph ph-fire"></i> Jogos Decisivos Pendentes</div><div class="decisive-list">${decisiveHtml}</div>` : ''}

        <div class="section-heading"><i class="ph ph-list"></i> Todos os Grupos</div>
        <div class="groups-grid">${grupos.map(g => buildGroupCard(g, jogos, qualifiedAll)).join('')}</div>
      `;
      allHtml += `<div class="cat-section${activeTab==='TODOS'?' active':''}" id="cat-TODOS">${todosContent}</div>`;
    }

    // -- Per-category sections --
    CATS.forEach(cat => {
      const catGrupos = grupos.filter(g => g.cat === cat);
      const qualified = getQualified(cat, grupos, jogos);
      const hasWc     = WILDCARD_CATS.has(cat);

      // Cat chips
      const diretos   = [...qualified.entries()].filter(([,v])=>v.type==='direto').length;
      const wildcards = [...qualified.entries()].filter(([,v])=>v.type==='wildcard').length;
      const totalPairs= catGrupos.reduce((s,g)=>s+computeStandings(g,jogos).length,0);
      const clr = CAT_CLR[cat] || '#8AA396';
      const chipsHtml = `<div class="cat-chips">
        <span class="chip chip-verde"><span class="chip-dot" style="background:var(--verde)"></span>${diretos} Apurados direto</span>
        ${hasWc ? `<span class="chip chip-amarelo"><span class="chip-dot" style="background:var(--amarelo)"></span>${wildcards} Wildcard</span>` : ''}
        <span class="chip chip-azul"><span class="chip-dot" style="background:var(--azul)"></span>${totalPairs - diretos - wildcards} Em disputa</span>
      </div>`;

      // Qualified list for this cat
      let catQualHtml = '';
      if (qualified.size > 0) {
        const cards = [...qualified.entries()].map(([par, v]) =>
          `<div class="qual-card q-${v.type}">
            <span class="qual-dot qual-dot-${v.type === 'direto' ? 'verde' : 'amarelo'}"></span>
            <span class="qual-name" title="${escHtml(par)}">${escHtml(par)}</span>
            <span class="qual-from">${v.group}</span>
            <span class="qual-badge-sm qual-badge-${v.type}">${v.type === 'direto' ? 'Direto' : 'WC'}</span>
          </div>`
        ).join('');
        catQualHtml = `<div class="section-heading"><i class="ph ph-trophy"></i> Apurados</div><div class="qualified-grid">${cards}</div>`;
      }

      // Decisive games for this cat
      const catDecisive = groupJogos.filter(j => {
        if (j.resultado) return false;
        const jcat = j.grupo ? j.grupo.split('-')[0] : '';
        if (jcat !== cat) return false;
        return !qualified.has(j.eq1) || !qualified.has(j.eq2);
      }).slice(0, 4);

      let catDecisiveHtml = '';
      if (catDecisive.length > 0) {
        catDecisiveHtml = `<div class="section-heading"><i class="ph ph-fire"></i> Jogos Decisivos</div>
          <div class="decisive-list">${catDecisive.map(j => {
            const timeStr = (j.data ? j.data.slice(5).replace('-','/') : '') + (j.hora ? ' ' + j.hora : '');
            return `<div class="decisive-row">
              <span class="decisive-tag">${escHtml(j.grupo)}</span>
              <span class="decisive-teams">${escHtml(j.eq1)} <span style="color:var(--cinza-texto);font-size:.65rem">vs</span> ${escHtml(j.eq2)}</span>
              ${j.campo ? `<span class="decisive-field"><i class="ph ph-map-pin"></i> ${escHtml(j.campo)}</span>` : ''}
              ${timeStr ? `<span class="decisive-time">${escHtml(timeStr)}</span>` : ''}
            </div>`;
          }).join('')}</div>`;
      }

      const groupsHtml = catGrupos.map(g => buildGroupCard(g, jogos, qualified)).join('');

      allHtml += `<div class="cat-section${activeTab===cat?' active':''}" id="cat-${cat}">
        ${chipsHtml}
        ${catQualHtml}
        ${catDecisiveHtml}
        <div class="section-heading"><i class="ph ph-list"></i> Grupos</div>
        <div class="groups-grid">${groupsHtml || '<div class="empty-box">Sem grupos para esta categoria.</div>'}</div>
      </div>`;
    });

    contentEl.innerHTML = allHtml;
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('pt-PT');
  }

  function switchTab(cat, btn) {
    activeTab = cat;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('active'));
    document.getElementById('cat-' + cat)?.classList.add('active');
  }

  // â”€â”€ 15-min countdown â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  const REFRESH_SECS = 15 * 60; // 15 minutes
  let countdown = REFRESH_SECS;
  const countEl = document.getElementById('refreshCountdown');

  function fmtCountdown(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function tick() {
    countdown--;
    if (countEl) countEl.textContent = fmtCountdown(countdown);
    if (countdown <= 0) { countdown = REFRESH_SECS; renderAll(); }
    setTimeout(tick, 1000);
  }

  function forceRefresh() {
    countdown = REFRESH_SECS;
    renderAll();
  }

  // â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  renderAll();
  setTimeout(tick, 1000);
  window.addEventListener('pp:datasynced', function() { countdown = REFRESH_SECS; renderAll(); }, { once: true });
</script>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("/playpadelcoop/sw.js").catch(function(){});}</script>
</body>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00C37B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Quadro de Apuramento — Play Padel 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style>
    :root {
      --verde:#00C37B; --preto:#0A0F0D; --preto-card:#111815; --preto-borda:#1C2620;
      --cinza-escuro:#1E2922; --cinza-texto:#8AA396; --branco:#F0F7F3;
      --amarelo:#F5C518; --vermelho:#FF4A4A; --verde-neon:#39FF8F; --azul:#4A9EFF;
      --radius:10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--preto); color: var(--branco); min-height: 100vh; }

    .top-bar { display:flex; align-items:center; justify-content:space-between; padding:.75rem 1.5rem; background:var(--preto-card); border-bottom:1px solid var(--preto-borda); position:sticky; top:0; z-index:50; gap:1rem; }
    .top-bar-left { display:flex; flex-direction:column; }
    .top-bar-logo { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:1.4rem; color:var(--verde); letter-spacing:.04em; line-height:1.1; }
    .top-bar-subtitle { font-size:.78rem; color:var(--cinza-texto); }
    .top-bar-right { display:flex; align-items:center; gap:.75rem; }
    .refresh-indicator { display:flex; align-items:center; gap:.4rem; font-size:.75rem; color:var(--cinza-texto); }
    .refresh-dot { width:7px; height:7px; border-radius:50%; background:var(--verde); animation:pulse 2s infinite; flex-shrink:0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .refresh-countdown { font-weight:700; color:var(--verde); min-width:2.4rem; text-align:right; font-variant-numeric:tabular-nums; }
    .btn-refresh { background:none; border:1px solid var(--preto-borda); border-radius:6px; color:var(--cinza-texto); padding:.3rem .65rem; font-size:.75rem; cursor:pointer; display:flex; align-items:center; gap:.35rem; transition:all .15s; }
    .btn-refresh:hover { border-color:var(--verde); color:var(--verde); }
    .live-badge { font-size:.58rem; font-weight:900; text-transform:uppercase; letter-spacing:.1em; background:var(--vermelho); color:#fff; padding:.15rem .45rem; border-radius:4px; animation:livepulse 1.5s infinite; }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .progress-bar-wrap { padding:.6rem 1.5rem; background:var(--preto-card); border-bottom:1px solid var(--preto-borda); }
    .progress-meta { display:flex; justify-content:space-between; align-items:center; font-size:.72rem; color:var(--cinza-texto); margin-bottom:.35rem; }
    .progress-meta strong { color:var(--branco); }
    .progress-track { height:4px; background:var(--preto-borda); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--verde),var(--verde-neon)); border-radius:2px; transition:width .6s ease; }

    .cat-tabs { display:flex; gap:.35rem; padding:.6rem 1.5rem; flex-wrap:wrap; border-bottom:1px solid var(--preto-borda); background:var(--preto-card); }
    .cat-tab { padding:.3rem .75rem; border-radius:6px; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; background:var(--cinza-escuro); color:var(--cinza-texto); border:none; transition:all .15s; }
    .cat-tab:hover { color:var(--branco); background:rgba(0,195,123,.15); }
    .cat-tab.active { background:var(--verde); color:#000; }

    .content { padding:1.25rem 1.5rem; }
    .cat-section { display:none; }
    .cat-section.active { display:block; }

    .cat-chips { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.25rem; }
    .chip { display:inline-flex; align-items:center; gap:.4rem; padding:.3rem .7rem; border-radius:20px; font-size:.72rem; font-weight:600; }
    .chip-verde   { background:rgba(0,195,123,.15);  color:var(--verde);  border:1px solid rgba(0,195,123,.3); }
    .chip-azul    { background:rgba(74,158,255,.15); color:var(--azul);   border:1px solid rgba(74,158,255,.3); }
    .chip-dot { width:6px; height:6px; border-radius:50%; }

    .section-heading { font-family:'Barlow Condensed',sans-serif; font-size:1rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cinza-texto); margin-bottom:.75rem; display:flex; align-items:center; gap:.5rem; }
    .section-heading.sh-red   { color:var(--vermelho); }
    .section-heading.sh-green { color:var(--verde); }

    .qualified-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:.4rem; margin-bottom:1.25rem; }
    .qual-card { background:var(--preto-card); border:1px solid var(--preto-borda); border-radius:8px; padding:.5rem .75rem; display:flex; flex-direction:column; gap:0; }
    .qual-card.q-apurado   { border-left:3px solid var(--verde); }
    .qual-card.q-eliminado { border-left:3px solid var(--vermelho); opacity:.8; }
    .qual-row { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; line-height:1.5; }
    .qual-p1 { font-size:.78rem; font-weight:600; color:var(--branco); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
    .qual-p1.elim { color:var(--cinza-texto); }
    .qual-p2 { font-size:.78rem; font-weight:600; color:var(--branco); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
    .qual-p2.elim { color:var(--cinza-texto); }
    .qual-from { font-size:.65rem; color:var(--cinza-texto); white-space:nowrap; flex-shrink:0; }
    .qual-seed { font-family:'Barlow Condensed',sans-serif; font-size:.65rem; font-weight:800; color:var(--azul); background:rgba(74,158,255,.15); border:1px solid rgba(74,158,255,.3); border-radius:4px; padding:.05rem .3rem; flex-shrink:0; white-space:nowrap; letter-spacing:.03em; }
    .qual-badge-sm { font-size:.6rem; font-weight:700; padding:.1rem .35rem; border-radius:4px; flex-shrink:0; white-space:nowrap; }
    .badge-ap  { background:rgba(0,195,123,.2);  color:var(--verde); }
    .badge-el  { background:rgba(255,74,74,.2);   color:var(--vermelho); }
    .badge-wc  { background:rgba(245,197,24,.2);  color:var(--amarelo); }
    .q-wildcard { border-left:3px solid var(--amarelo) !important; }
    .qual-empty { color:var(--cinza-texto); font-size:.82rem; padding:.5rem 0 .75rem; }

    .results-list { display:grid; grid-template-columns:repeat(2,1fr); gap:.4rem; margin-bottom:1.5rem; }
    .result-row { background:var(--preto-card); border:1px solid var(--preto-borda); border-radius:8px; padding:.55rem 1rem; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.75rem; font-size:.78rem; }
    .result-left  { display:flex; align-items:center; justify-content:flex-end; gap:.5rem; overflow:hidden; }
    .result-right { display:flex; align-items:center; justify-content:flex-start; gap:.5rem; overflow:hidden; }
    .result-team { overflow:hidden; flex:1; }
    .result-team.winner { color:var(--branco); font-weight:600; }
    .result-team-name { display:block; font-size:.78rem; font-weight:inherit; line-height:1.3; }
    .result-team.loser  { color:var(--cinza-texto); }
    .result-team.right  { text-align:right; }
    .result-center { display:flex; flex-direction:column; align-items:center; gap:.15rem; flex-shrink:0; }
    .result-sets { display:flex; gap:.35rem; align-items:center; }
    .result-set-score { font-family:'Barlow Condensed',sans-serif; font-size:1rem; font-weight:700; color:var(--verde); white-space:nowrap; }
    .result-set-score.losing { color:var(--cinza-texto); font-weight:400; }
    .result-set-sep { color:var(--cinza-escuro); font-size:.7rem; }
    .result-group-lbl { font-size:.6rem; color:var(--cinza-texto); background:var(--cinza-escuro); padding:.1rem .35rem; border-radius:4px; white-space:nowrap; letter-spacing:.03em; }

    .decisive-list { display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; margin-bottom:1.5rem; }
    .decisive-row { background:var(--preto-card); border:1px solid rgba(245,197,24,.25); border-radius:8px; padding:.45rem .75rem; display:flex; align-items:center; gap:.55rem; font-size:.73rem; min-width:0; }
    .decisive-tag  { font-size:.6rem; font-weight:700; padding:.1rem .3rem; border-radius:4px; background:rgba(245,197,24,.15); color:var(--amarelo); white-space:nowrap; flex-shrink:0; }
    .decisive-match { flex:1; display:flex; align-items:center; gap:.35rem; min-width:0; overflow:hidden; }
    .decisive-eq { flex:1; color:var(--branco); font-weight:500; font-size:.73rem; line-height:1.3; min-width:0; overflow:hidden; }
    .decisive-eq.right { text-align:right; }
    .decisive-vs { font-size:.6rem; color:var(--cinza-texto); font-weight:700; flex-shrink:0; }
    .decisive-time  { font-size:.65rem; color:var(--cinza-texto); white-space:nowrap; flex-shrink:0; }
    .decisive-field { font-size:.62rem; color:var(--cinza-texto); flex-shrink:0; }

    .groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1rem; }
    .group-card { background:var(--preto-card); border:1px solid var(--preto-borda); border-radius:var(--radius); overflow:hidden; }
    .group-card-header { display:flex; align-items:center; justify-content:space-between; padding:.55rem 1rem; border-bottom:1px solid var(--preto-borda); }
    .group-card-title { font-family:'Barlow Condensed',sans-serif; font-size:1.05rem; font-weight:700; letter-spacing:.04em; }
    .group-card-meta { display:flex; align-items:center; gap:.5rem; }
    .group-progress-txt { font-size:.65rem; color:var(--cinza-texto); }
    .badge-decided { font-size:.6rem; font-weight:700; padding:.1rem .4rem; border-radius:4px; background:rgba(0,195,123,.2); color:var(--verde); }
    .badge-live    { font-size:.6rem; font-weight:700; padding:.1rem .4rem; border-radius:4px; background:rgba(74,158,255,.2); color:var(--azul); animation:livepulse 2s infinite; }
    .std-table { width:100%; border-collapse:collapse; font-size:.74rem; }
    .std-table th { padding:.3rem .5rem; color:var(--cinza-texto); font-weight:600; text-align:right; border-bottom:1px solid var(--preto-borda); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; }
    .std-table th:nth-child(2) { text-align:left; }
    .std-table td { padding:.36rem .5rem; text-align:right; border-bottom:1px solid rgba(255,255,255,.04); }
    .std-table td:nth-child(2) { text-align:left; }
    .std-table tr:last-child td { border-bottom:none; }
    .status-col { width:8px; padding:.36rem .35rem .36rem .5rem; }
    .status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
    .dot-verde    { background:var(--verde); }
    .dot-amarelo  { background:var(--amarelo); }
    .dot-azul     { background:var(--azul); }
    .dot-vermelho { background:var(--vermelho); }
    .dot-cinza    { background:var(--cinza-escuro); }
    .pair-name { max-width:140px; overflow:hidden; display:block; line-height:1.35; }
    .row-elim td { opacity:.5; }
    .row-elim td:nth-child(2) span { }

    .footer-bar { text-align:center; padding:1.25rem; font-size:.72rem; color:var(--cinza-texto); border-top:1px solid var(--preto-borda); margin-top:1.5rem; }
    .empty-box { text-align:center; padding:2rem; color:var(--cinza-texto); font-size:.82rem; }

    /* â”€â”€ Pesquisa "A minha dupla" â”€â”€ */
    .search-bar { display:flex; align-items:center; gap:.55rem; padding:.55rem 1.5rem; background:var(--preto-card); border-bottom:1px solid var(--preto-borda); }
    .search-input { flex:1; min-width:0; background:var(--preto); border:1px solid var(--preto-borda); border-radius:8px; color:var(--branco); font-family:'Inter',sans-serif; font-size:.85rem; padding:.5rem .7rem; outline:none; transition:border-color .15s; }
    .search-input::placeholder { color:var(--cinza-texto); }
    .search-input:focus { border-color:var(--verde); }
    .search-count { font-size:.72rem; color:var(--cinza-texto); white-space:nowrap; font-weight:600; }
    .search-clear { background:none; border:1px solid var(--preto-borda); border-radius:6px; color:var(--cinza-texto); width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
    .search-clear:hover { color:var(--vermelho); border-color:rgba(255,74,74,.4); }
    tr.pair-hit td { background:rgba(245,197,24,.14) !important; }
    tr.pair-hit .pair-name { color:var(--amarelo) !important; font-weight:800; }
    .qual-card.pair-hit { box-shadow:0 0 0 2px var(--amarelo); }
    .group-card.card-hit { border-color:var(--amarelo); box-shadow:0 0 0 1px rgba(245,197,24,.45); }
    [data-par].search-dim { opacity:.24; transition:opacity .2s; }

    /* â”€â”€ Cenários "O que falta para apurar" â”€â”€ */
    .sc-row td { padding:.15rem .5rem .45rem !important; border-bottom:1px solid rgba(255,255,255,.04) !important; }
    .sc-note { display:flex; align-items:flex-start; gap:.4rem; font-size:.68rem; line-height:1.35; padding:.32rem .5rem; border-radius:6px; }
    .sc-note i { font-size:.85rem; margin-top:.06rem; flex-shrink:0; }
    .sc-note b { font-weight:700; }
    .sc-opp { color:var(--branco); font-weight:600; }
    .sc-decisive { background:rgba(245,197,24,.1);  color:#e8d38a; border:1px solid rgba(245,197,24,.22); }
    .sc-win      { background:rgba(0,195,123,.1);   color:#7fe0b4; border:1px solid rgba(0,195,123,.22); }
    .sc-warn     { background:rgba(255,74,74,.08);  color:#f2a3a3; border:1px solid rgba(255,74,74,.2); }
    .sc-wait     { background:var(--cinza-escuro);  color:var(--cinza-texto); }
    .sc-wait .sc-opp { color:var(--branco); }

    @media (max-width:640px) {
      .top-bar { padding:.6rem 1rem; flex-wrap:wrap; }
      .cat-tabs { padding:.5rem 1rem; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
      .cat-tabs::-webkit-scrollbar { display:none; }
      .cat-tab { flex-shrink:0; font-size:.72rem; padding:.28rem .65rem; }
      .content { padding:.85rem .75rem; }
      .groups-grid { grid-template-columns:1fr; }
      .qualified-grid { grid-template-columns:1fr 1fr; }
      .progress-bar-wrap { padding:.5rem 1rem; }
      .decisive-list { grid-template-columns:1fr; }
      .results-list { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <a href="index.html" style="display:flex;align-items:center;gap:.6rem;text-decoration:none">
      <img src="playpadellogo.jpg" alt="Play Padel" style="height:32px;width:32px;border-radius:7px;object-fit:cover;flex-shrink:0"/>
      <div>
        <div class="top-bar-logo">PLAY PADEL <span style="color:var(--branco);font-weight:400">2026</span></div>
        <div class="top-bar-subtitle">Quadro de Apuramento</div>
      </div>
    </a>
  </div>
  <div class="top-bar-right">
    <button class="btn-refresh" id="btnAutoScroll" onclick="toggleAutoScroll()" title="Auto-scroll para TV"><i class="ph ph-play" id="autoScrollIcon"></i> Auto-scroll</button>
    <button class="btn-refresh" onclick="forceRefresh()"><i class="ph ph-arrows-clockwise"></i> Actualizar</button>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-meta">
    <span><strong id="progDone">0</strong> / <strong id="progTotal">0</strong> jogos disputados</span>
    <span id="progGroups"></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="cat-tabs" id="catTabs"></div>
<div class="search-bar">
  <i class="ph ph-magnifying-glass" style="color:var(--cinza-texto);flex-shrink:0"></i>
  <input id="pairSearch" class="search-input" type="search" autocomplete="off" spellcheck="false"
    placeholder="A minha dupla — procurar jogador ou dupla…"
    oninput="onPairSearch(this.value)"
    onkeydown="if(event.key==='Enter'){event.preventDefault();jumpToPair();}">
  <span id="pairSearchCount" class="search-count"></span>
  <button id="pairSearchClear" class="search-clear" style="display:none" onclick="clearPairSearch()" title="Limpar pesquisa"><i class="ph ph-x"></i></button>
</div>
<div class="content" id="mainContent"></div>
<div class="footer-bar">
  <div style="display:flex;justify-content:center;gap:1.25rem;flex-wrap:wrap;margin-bottom:.6rem;font-size:.7rem;">
    <span style="display:flex;align-items:center;gap:.35rem"><span style="width:8px;height:8px;border-radius:50%;background:var(--verde);display:inline-block"></span> Apurado</span>
    <span style="display:flex;align-items:center;gap:.35rem"><span style="width:8px;height:8px;border-radius:50%;background:var(--amarelo);display:inline-block"></span> Em disputa (wildcard)</span>
    <span style="display:flex;align-items:center;gap:.35rem"><span style="width:8px;height:8px;border-radius:50%;background:var(--azul);display:inline-block"></span> Em disputa</span>
    <span style="display:flex;align-items:center;gap:.35rem"><span style="width:8px;height:8px;border-radius:50%;background:var(--vermelho);display:inline-block"></span> Eliminado</span>
  </div>
  Última actualização: <span id="lastUpdate">—</span>
</div>

<script src="js/data.js"></script>
<script src="js/nav-config.js" defer></script>
<script>
  function ppLoad(k) { try { return JSON.parse(localStorage.getItem('pp_' + k)); } catch(e) { return null; } }
  function getData(k) {
    const s = ppLoad(k);
    if (s !== null) return s;
    return typeof INITIAL_DATA !== 'undefined' ? (INITIAL_DATA[k] || []) : [];
  }

  const CATS = ['M1','M2','M3','M4','M5','F1','F2','F3'];
  // Formato de apuramento por categoria (regras oficiais).
  //  directN = nº de melhores por grupo que apuram directo; single = grupo único;
  //  wcN = nº de wildcards (melhor classificado logo abaixo dos lugares directos).
  const APU = {
    F1:{directN:4,single:true,wcN:0}, F2:{directN:4,single:true,wcN:0}, F3:{directN:4,single:true,wcN:0},
    M1:{directN:2,wcN:0},
    M2:{directN:2,wcN:0}, M4:{directN:2,wcN:0},
    M5:{directN:2,wcN:2},
    M3:{directN:1,wcN:3},
  };
  function apuCfg(cat){ return APU[cat] || {directN:2,wcN:0}; }
  const CAT_CLR = { M1:'#4A9EFF', M2:'#00C37B', M3:'#39FF8F', M4:'#F5C518', M5:'#FF9A3C', F1:'#FF6BB0', F2:'#C97BFF', F3:'#8B5CF6' };

  // â”€â”€ Standings (V, sets, games) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function computeStandings(grupo, jogos) {
    const gJogos = jogos.filter(j => j.grupo === grupo.id);
    const table  = {};
    gJogos.forEach(j => {
      if (!table[j.eq1]) table[j.eq1] = { par:j.eq1, pj:0, v:0, d:0, sv:0, sl:0, gv:0, gl:0 };
      if (!table[j.eq2]) table[j.eq2] = { par:j.eq2, pj:0, v:0, d:0, sv:0, sl:0, gv:0, gl:0 };
    });
    gJogos.forEach(j => {
      if (!j.resultado) return;
      const r = j.resultado;
      if (r.wo) {
        // wo: 'eq1' means eq1 gave the WO (forfeited) → eq2 wins; WO = 6-0 6-0
        const win = r.wo==='eq1'?j.eq2:j.eq1, los = r.wo==='eq1'?j.eq1:j.eq2;
        if (table[win]) { table[win].pj++; table[win].v++; table[win].sv+=2; table[win].gv+=12; }
        if (table[los]) { table[los].pj++;  table[los].d++; table[los].sl+=2; table[los].gl+=12; }
        return;
      }
      const sets = [[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].filter(([a,b])=>a!=null&&b!=null);
      let ve1=0,ve2=0,gv1=0,gl1=0,gv2=0,gl2=0,sv1=0,sl1=0,sv2=0,sl2=0;
      sets.forEach(([a,b])=>{ if(a>b){ve1++;sv1++;sl2++;}else{ve2++;sv2++;sl1++;} gv1+=a;gl1+=b;gv2+=b;gl2+=a; });
      const w1=ve1>ve2;
      if(table[j.eq1]){table[j.eq1].pj++;table[j.eq1].sv+=sv1;table[j.eq1].sl+=sl1;table[j.eq1].gv+=gv1;table[j.eq1].gl+=gl1;if(w1)table[j.eq1].v++;else table[j.eq1].d++;}
      if(table[j.eq2]){table[j.eq2].pj++;table[j.eq2].sv+=sv2;table[j.eq2].sl+=sl2;table[j.eq2].gv+=gv2;table[j.eq2].gl+=gl2;if(!w1)table[j.eq2].v++;else table[j.eq2].d++;}
    });
    function miniGroupSort(rows) {
      const byV = {};
      rows.forEach(r => { (byV[r.v] = byV[r.v] || []).push(r); });
      return Object.keys(byV).map(Number).sort((a,b)=>b-a).flatMap(v => {
        const g = byV[v];
        if (g.length === 1) return g;
        const pars = new Set(g.map(r => r.par));
        const ms = {}; g.forEach(r => { ms[r.par] = {v:0,sv:0,sl:0,gv:0,gl:0}; });
        gJogos.forEach(j => {
          if (!j.resultado || !pars.has(j.eq1) || !pars.has(j.eq2)) return;
          const r = j.resultado;
          if (r.wo) {
            const win=r.wo==='eq1'?j.eq2:j.eq1, los=r.wo==='eq1'?j.eq1:j.eq2;
            ms[win].v++; ms[win].sv+=2; ms[win].gv+=12; ms[los].sl+=2; ms[los].gl+=12; return;
          }
          const sets=[[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].filter(([a,b])=>a!=null&&b!=null);
          let ve1=0,ve2=0;
          sets.forEach(([a,b])=>{ if(a>b){ve1++;ms[j.eq1].sv++;ms[j.eq1].gv+=a;ms[j.eq1].gl+=b;ms[j.eq2].sl++;ms[j.eq2].gv+=b;ms[j.eq2].gl+=a;}else{ve2++;ms[j.eq2].sv++;ms[j.eq2].gv+=b;ms[j.eq2].gl+=a;ms[j.eq1].sl++;ms[j.eq1].gv+=a;ms[j.eq1].gl+=b;} });
          if(ve1>ve2)ms[j.eq1].v++;else ms[j.eq2].v++;
        });
        return [...g].sort((a,b)=>{
          const ma=ms[a.par],mb=ms[b.par];
          return mb.v-ma.v||(mb.sv-mb.sl)-(ma.sv-ma.sl)||(mb.gv-mb.gl)-(ma.gv-ma.gl)||mb.gv-ma.gv
                ||(b.sv-b.sl)-(a.sv-a.sl)||(b.gv-b.gl)-(a.gv-a.gl)||b.gv-a.gv;
        });
      });
    }
    return miniGroupSort(Object.values(table));
  }

  // â”€â”€ Reachability por vitórias (enumera resultados dos jogos em falta) â”€â”€â”€â”€â”€â”€
  // Grupos são pequenos (≤5 duplas, poucos jogos em falta), por isso podemos
  // enumerar TODOS os cenários possíveis dos jogos por disputar. Isto capta
  // situações que a heurística min/max falha, p.ex. duas duplas empatadas que
  // ainda jogam ENTRE SI (uma delas sobe obrigatoriamente).
  //   qual = duplas garantidamente no top-directN em TODOS os cenários
  //   elim = duplas que NÃO chegam ao top-directN em NENHUM cenário
  // Devolve null se houver jogos a mais (fallback para a heurística simples).
  function _winsReachability(rows, remPairs, directN) {
    const pars = rows.map(r => r.par);
    const base = {}; rows.forEach(r => { base[r.par] = r.v; });
    const games = remPairs.filter(([a, b]) => base[a] != null && base[b] != null);
    const m = games.length;
    if (m > 16) return null;
    const qual = new Set(pars);   // otimista: retiramos ao encontrar contra-cenário
    const elim = new Set(pars);   // pessimista: retiramos quando a dupla alcança o top
    for (let mask = 0; mask < (1 << m); mask++) {
      const w = { ...base };
      for (let i = 0; i < m; i++) { const [a, b] = games[i]; if (mask & (1 << i)) w[a]++; else w[b]++; }
      pars.forEach(p => {
        let ge = 0, gt = 0;
        pars.forEach(q => { if (q !== p) { if (w[q] >= w[p]) ge++; if (w[q] > w[p]) gt++; } });
        if (ge > directN - 1) qual.delete(p); // existe cenário em que não fica garantido no top
        if (gt < directN)     elim.delete(p); // existe cenário em que alcança o top
      });
    }
    return { qual, elim };
  }

  // â”€â”€ Mathematical confirmation of status â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // Returns Map: par -> { status, group }
  // status: 'qualified' | 'eliminated' | 'contention_wc' | 'contention'
  //
  // 'qualified'     = confirmed top-2 regardless of remaining results
  //                   (at most 1 other pair can reach >= this pair's worst-case wins)
  // 'eliminated'    = confirmed cannot reach top-2 (or wildcard if applicable)
  //                   (2+ pairs already guaranteed to beat this pair's best-case wins)
  // 'contention_wc' = cannot make top-2 in group, still in wildcard contention
  // 'contention'    = still in play for top-2
  function getConfirmedStatus(cat, grupos, jogos) {
    const catGrupos = grupos.filter(g => g.cat === cat);
    const cfg       = apuCfg(cat);
    const directN   = cfg.directN;
    const wcN       = cfg.wcN;
    const hasWc     = wcN > 0;

    const allGroupData = catGrupos.map(g => {
      const rows     = computeStandings(g, jogos);
      const nPairs   = rows.length;
      const gPerPair = Math.max(0, nPairs - 1);
      rows.forEach(r => {
        r._remaining = Math.max(0, gPerPair - r.pj);
        r._maxWins   = r.v + r._remaining;
        r._minWins   = r.v;
      });
      return { g, rows };
    });

    const result = new Map();

    allGroupData.forEach(({ g, rows }) => {
      const allDone = rows.every(r => r._remaining === 0);
      if (allDone) {
        // All games played: trust the sorted rows[] order directly.
        // rows[0..1] = qualified, rows[2] = wildcard candidate (eliminated_group), rows[3+] = eliminated.
        // This correctly handles ties broken by tiebreakers (not just wins).
        rows.forEach((r, i) => {
          if (i < directN) {
            result.set(r.par, { status: 'qualified', group: g.id });
          } else {
            result.set(r.par, {
              status: hasWc && i === directN ? 'eliminated_group' : 'eliminated',
              group: g.id, _maxWins: r._maxWins, _minWins: r._minWins,
              _sv: r.sv, _sl: r.sl, _gv: r.gv, _gl: r.gl
            });
          }
        });
      } else {
        const remPairs = jogos
          .filter(j => !j.resultado && j.grupo === g.id)
          .map(j => [j.eq1, j.eq2]);
        const reach = _winsReachability(rows, remPairs, directN);
        rows.forEach(r => {
          // How many others can potentially reach >= r's min wins (could overtake in worst case)
          const canOvertake = rows.filter(o => o.par !== r.par && o._maxWins >= r._minWins).length;
          // How many others are guaranteed to have STRICTLY MORE wins than r's best case
          const guaranteedAbove = rows.filter(o => o.par !== r.par && o._minWins > r._maxWins).length;
          // Reachability exacta (enumeração) com fallback para a heurística.
          const isQual = reach ? reach.qual.has(r.par) : (canOvertake <= directN - 1);
          const isElim = reach ? reach.elim.has(r.par) : (guaranteedAbove >= directN);

          if (isQual) {
            result.set(r.par, { status: 'qualified', group: g.id });
          } else if (isElim) {
            result.set(r.par, {
              status: hasWc ? 'eliminated_group' : 'eliminated',
              group: g.id, _maxWins: r._maxWins, _minWins: r._minWins,
              _sv: r.sv, _sl: r.sl, _gv: r.gv, _gl: r.gl
            });
          } else {
            result.set(r.par, { status: 'contention', group: g.id });
          }
        });
      }
    });

    // For wildcard cats: check if eliminated-from-group pairs can still get wildcard
    if (hasWc) {
      // Uma dupla que não faz o corte directo (eliminated_group) ainda pode
      // apanhar wildcard SE puder terminar no lugar elegível do seu grupo (2.º =
      // rank directN). Isso só é possível se, no MELHOR cenário dela, no máximo
      // directN duplas do mesmo grupo estiverem garantidamente acima. Caso
      // contrário está fora de alcance → eliminada. Duas duplas com a mesma
      // situação obtêm sempre o mesmo estado.
      const contenders = [];
      allGroupData.forEach(({ g, rows }) => {
        rows.forEach(t => {
          if (result.get(t.par)?.status !== 'eliminated_group') return;
          const guaranteedAbove = rows.filter(o => o.par !== t.par && o._minWins > t._maxWins).length;
          const payload = {
            group: g.id, _maxWins: t._maxWins, _minWins: t._minWins, _remaining: t._remaining,
            _sv: t.sv, _sl: t.sl, _gv: t.gv, _gl: t.gl
          };
          if (guaranteedAbove > directN) {
            result.set(t.par, { status: 'eliminated', ...payload });
          } else {
            result.set(t.par, { status: 'contention_wc', ...payload });
            contenders.push({ par: t.par, ...payload });
          }
        });
      });

      // Pré-eliminação cross-group SEGURA: uma dupla que ainda tem jogos por
      // disputar é eliminada da corrida ao wildcard se, mesmo no seu MELHOR
      // cenário possível (ganhar tudo o que falta por 6-0), já existirem pelo
      // menos wcN rivais de OUTROS grupos com posição FECHADA (sem jogos por
      // disputar) garantidamente à frente na ordenação de wildcard (vitórias,
      // dif. sets, dif. jogos, jogos ganhos). Só compara contra rivais fechados,
      // por isso nunca gera falsos eliminados.
      const lockedRivals = contenders.filter(c => c._remaining === 0);
      contenders.forEach(p => {
        if (p._remaining === 0) return;
        const pb = {
          w:  p._maxWins,
          sd: (p._sv - p._sl) + 2 * p._remaining,
          gd: (p._gv - p._gl) + 12 * p._remaining,
          gv: p._gv + 12 * p._remaining
        };
        const above = lockedRivals.filter(rv => {
          if (rv.group === p.group) return false;
          const rsd = rv._sv - rv._sl, rgd = rv._gv - rv._gl;
          if (rv._maxWins !== pb.w) return rv._maxWins > pb.w;
          if (rsd !== pb.sd) return rsd > pb.sd;
          if (rgd !== pb.gd) return rgd > pb.gd;
          return rv._gv > pb.gv;
        }).length;
        if (above >= wcN) result.set(p.par, { status: 'eliminated', group: p.group });
      });

      // Quando TODA a fase de grupos da categoria terminou, cada grupo tem um 2.º
      // lugar determinado → ordenam-se os candidatos e atribuem-se as vagas de
      // wildcard. Enquanto a categoria não fecha, todas as duplas ainda ao
      // alcance permanecem em disputa (amarelo) — não pré-eliminamos entre grupos.
      const allCatDone = allGroupData.every(({ rows }) => rows.every(r => r._remaining === 0));
      if (allCatDone && wcN > 0) {
        const ranked = [...contenders].sort((a, b) =>
          b._maxWins - a._maxWins ||
          (b._sv - b._sl) - (a._sv - a._sl) ||
          (b._gv - b._gl) - (a._gv - a._gl) ||
          b._gv - a._gv
        );
        ranked.forEach((t, i) => {
          result.set(t.par, { status: i < wcN ? 'qualified' : 'eliminated', group: t.group, _isWildcard: i < wcN });
        });
      }
    }

    return result;
  }

  // â”€â”€ Check if a group is fully decided (no remaining games can change top 2) â”€
  function isGroupDecided(rows, totalGames, directN) {
    directN = directN || 2;
    if (!rows[directN - 1] || rows[directN - 1].pj === 0) return false;
    const gamesPlayed = rows.reduce((s, r) => s + r.pj, 0) / 2;
    const remaining   = totalGames - gamesPlayed;
    if (remaining === 0) return true;
    if (rows.length <= directN || !rows[directN]) return remaining === 0;
    const maxNext = rows[directN].v + remaining;
    return maxNext < rows[directN - 1].v;
  }

  // â”€â”€ Format result score â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function fmtScore(r) {
    if (!r) return '';
    if (r.wo) return 'W/O';
    const parts = [];
    [[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].forEach(([a,b]) => {
      if (a != null && b != null) parts.push(a + '-' + b);
    });
    return parts.join(' ');
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // â”€â”€ Cenários de apuramento ("o que falta") â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // Reutiliza getConfirmedStatus (matematicamente correcto) para simular o
  // próximo jogo da dupla: vitória apura? derrota elimina? Cache por render.
  let _scenCache = new Map();
  // Constrói um resultado a partir da perspectiva da dupla (pairIsEq1): sets é
  // uma lista de [jogosDaDupla, jogosDoAdversario].
  function _mkResultado(pairIsEq1, sets) {
    const r = { s1eq1:null,s1eq2:null,s2eq1:null,s2eq2:null,s3eq1:null,s3eq2:null };
    sets.forEach(([pg, og], i) => {
      const n = i + 1;
      if (pairIsEq1) { r['s'+n+'eq1'] = pg; r['s'+n+'eq2'] = og; }
      else           { r['s'+n+'eq1'] = og; r['s'+n+'eq2'] = pg; }
    });
    return r;
  }
  // Margens (perspectiva da dupla): vitória máxima vs vitória mínima possível;
  // derrota máxima vs melhor derrota possível. Usadas para testar se o
  // apuramento/eliminação é GARANTIDO independentemente do resultado (margem).
  const _WIN_BIG  = [[6,0],[6,0]];        // 2-0 esmagador
  const _WIN_MIN  = [[7,6],[0,6],[7,6]];  // 2-1 renhido, diferença mínima de jogos
  const _LOSS_BIG = [[0,6],[0,6]];        // 0-2 esmagador
  const _LOSS_MIN = [[6,7],[7,6],[6,7]];  // 1-2 renhido (melhor cenário na derrota)
  function _simStatus(cat, grupos, jogos, gameId, pairIsEq1, sets, par) {
    const key = cat + '|' + gameId + '|' + (pairIsEq1?'1':'0') + '|' + sets.map(s=>s.join('-')).join(',');
    let m = _scenCache.get(key);
    if (!m) {
      const res = _mkResultado(pairIsEq1, sets);
      const jj = jogos.map(j => j.id === gameId ? { ...j, resultado: res } : j);
      m = getConfirmedStatus(cat, grupos, jj);
      _scenCache.set(key, m);
    }
    return m.get(par)?.status;
  }
  function _scRow(icon, cls, html) {
    return `<tr class="sc-row"><td colspan="8"><div class="sc-note ${cls}"><i class="ph ${icon}"></i><span>${html}</span></div></td></tr>`;
  }
  function buildScenario(par, g, jogos, grupos, status) {
    if (!grupos || (status !== 'contention' && status !== 'contention_wc')) return '';
    const rem = jogos.filter(j => !j.resultado && j.grupo === g.id && (j.eq1 === par || j.eq2 === par));
    if (rem.length === 0) return _scRow('ph-hourglass', 'sc-wait', 'Jogos terminados — apuramento depende de outros grupos.');
    // Com 2+ jogos por disputar não faz sentido destacar um só jogo com
    // "vitória apura / derrota elimina" — a frase decisiva fica reservada ao
    // último jogo do grupo. Aqui damos apenas o estado geral.
    if (rem.length >= 2) {
      const n = rem.length;
      if (status === 'contention_wc')
        return _scRow('ph-star', 'sc-wait', `Ainda com <b>${n} jogos</b> por disputar — em disputa pelo <b>wildcard</b>.`);
      return _scRow('ph-target', 'sc-wait', `Ainda com <b>${n} jogos</b> por disputar — apuramento em aberto.`);
    }
    const next = rem[0];
    const eq1 = next.eq1 === par;
    const opp  = escHtml((eq1 ? next.eq2 : next.eq1) || '').replace(' &amp; ', ' / ');
    const hora = next.hora ? (' · ' + escHtml(next.hora)) : '';
    const S = (sets) => _simStatus(g.cat, grupos, jogos, next.id, eq1, sets, par);
    // Vitória: garante apuramento em QUALQUER margem? (máxima E mínima)
    const winBig = S(_WIN_BIG), winMin = S(_WIN_MIN);
    const lossBig = S(_LOSS_BIG), lossMin = S(_LOSS_MIN);
    const winClinch = winBig === 'qualified' && winMin === 'qualified';   // garante sempre
    const winHelps  = winBig === 'qualified' && winMin !== 'qualified';   // só apura com margem
    const lossElim  = lossBig === 'eliminated' && lossMin === 'eliminated'; // elimina sempre
    const opTxt = `vs <span class="sc-opp">${opp}</span>${hora}`;

    if (winClinch && lossElim) return _scRow('ph-fire', 'sc-decisive', `<b>Jogo decisivo</b> ${opTxt} — vitória apura, derrota elimina.`);
    if (winClinch)             return _scRow('ph-seal-check', 'sc-win', `Vence ${opTxt} e <b>garante o apuramento</b>.`);
    if (lossElim) {
      // Derrota elimina de certeza. Vitória pode não bastar: em grupos com
      // wildcard o apuramento depende da margem/critérios de desempate.
      if (winHelps)
        return _scRow('ph-warning', 'sc-warn', `Derrota elimina. Para se apurar tem de vencer ${opTxt} <b>com margem suficiente</b> (desempate ao wildcard).`);
      if (winBig === 'contention_wc')
        return _scRow('ph-warning', 'sc-warn', `Tem de vencer ${opTxt} para continuar na corrida ao <b>wildcard</b> (sujeito a desempate).`);
      return _scRow('ph-warning', 'sc-warn', `Tem de vencer ${opTxt} para continuar na disputa.`);
    }
    if (winHelps) return _scRow('ph-target', 'sc-wait', `Uma vitória ${opTxt} aproxima do apuramento (sujeito a desempate).`);
    if (status === 'contention_wc') return _scRow('ph-star', 'sc-wait', `Em disputa pelo <b>wildcard</b> — próximo ${opTxt}.`);
    return _scRow('ph-target', 'sc-wait', `Em disputa — próximo ${opTxt}.`);
  }

  // â”€â”€ Build a single group card â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function buildGroupCard(g, jogos, confirmed, grupos) {
    const rows  = computeStandings(g, jogos);
    const gJogs = jogos.filter(j => j.grupo === g.id);
    const done  = gJogs.filter(j => j.resultado).length;
    const total = gJogs.length;
    const decided = isGroupDecided(rows, total, apuCfg(g.cat).directN);

    const headerBadge = decided
      ? '<span class="badge-decided">Decidido</span>'
      : (done > 0 ? '<span class="badge-live">Em curso</span>' : '');

    const rowsHtml = rows.map(r => {
      const conf = confirmed ? confirmed.get(r.par) : null;
      const st   = conf ? conf.status : (r.pj > 0 ? 'contention' : '');
      let dotCls    = 'dot-cinza';
      let rowClass  = '';
      if      (st === 'qualified')    { dotCls = 'dot-verde'; }
      else if (st === 'contention_wc'){ dotCls = 'dot-amarelo'; }
      else if (st === 'contention')   { dotCls = 'dot-azul'; }
      else if (st === 'eliminated')   { dotCls = 'dot-vermelho'; rowClass = 'row-elim'; }
      else if (r.pj > 0)             { dotCls = 'dot-azul'; }

      const pairTr = `<tr class="${rowClass}" data-par="${escHtml(r.par)}" data-cat="${g.cat}">
        <td class="status-col"><span class="status-dot ${dotCls}"></span></td>
        <td><span class="pair-name" title="${escHtml(r.par)}">${escHtml(r.par).replace(' &amp; ','<br>')}</span></td>
        <td style="font-weight:700;color:var(--branco)">${r.v*2}</td>
        <td>${r.pj}</td>
        <td style="color:var(--verde);font-weight:700">${r.v}</td>
        <td style="color:var(--vermelho)">${r.d}</td>
        <td>${r.sv}-${r.sl}</td>
        <td style="font-weight:700;color:var(--branco);white-space:nowrap">${r.gv}-${r.gl}</td>
      </tr>`;
      return pairTr + buildScenario(r.par, g, jogos, grupos, st);
    }).join('');

    return `<div class="group-card">
      <div class="group-card-header">
        <span class="group-card-title" style="color:${CAT_CLR[g.cat]||'var(--branco)'}">${g.id}</span>
        <div class="group-card-meta">
          <span class="group-progress-txt">${done}/${total}</span>
          ${headerBadge}
        </div>
      </div>
      <table class="std-table">
        <thead><tr><th></th><th>Par</th><th title="Pontos">PTS</th><th>PJ</th><th>V</th><th>D</th><th>Sets</th><th>G</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  }

  // â”€â”€ Build status panels (Apurados + Eliminados) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // -- Compute seed map (S1-S8) for a category
  function computeSeedMap(cat, grupos, jogos) {
    const catGrupos = grupos.filter(g => g.cat === cat);
    const cfg = apuCfg(cat);
    const sortPerf = (a, b) => b.v - a.v || (b.sv-b.sl)-(a.sv-a.sl) || (b.gv-b.gl)-(a.gv-a.gl) || b.gv - a.gv;
    const map = new Map();

    // Grupo único: seeds por posição no grupo (S1..SdirectN)
    if (cfg.single) {
      const g = catGrupos[0];
      if (g) computeStandings(g, jogos).slice(0, cfg.directN).forEach((r, i) => { if (r.pj > 0) map.set(r.par, i + 1); });
      return map;
    }

    // Seeds directos por tier (posição): 1.ºs → S1.., 2.ºs → .., etc.
    let seed = 0;
    for (let t = 0; t < cfg.directN; t++) {
      const tierRows = [];
      catGrupos.forEach(g => { const rows = computeStandings(g, jogos); if (rows[t]?.pj > 0) tierRows.push(rows[t]); });
      tierRows.sort(sortPerf);
      tierRows.forEach(r => map.set(r.par, ++seed));
    }
    // Wildcards: linha na posição directN (melhor logo abaixo dos directos), best wcN
    if (cfg.wcN > 0) {
      const wc = [];
      catGrupos.forEach(g => { const rows = computeStandings(g, jogos); if (rows[cfg.directN]?.pj > 0) wc.push(rows[cfg.directN]); });
      wc.sort(sortPerf);
      wc.slice(0, cfg.wcN).forEach(r => map.set(r.par, ++seed));
    }
    return map;
  }

  function buildStatusPanels(confirmedMap, seedMap) {
    const apurados  = [...confirmedMap.entries()].filter(([,v]) => v.status === 'qualified');
    const eliminados= [...confirmedMap.entries()].filter(([,v]) => v.status === 'eliminated');

    let html = '';
    if (apurados.length > 0) {
      const cards = apurados.map(([par, v]) => {
        const [p1, p2] = par.split(' & ');
        const isWc = !!v._isWildcard;
        const seed = seedMap?.get(par);
        const seedHtml = seed ? `<span class="qual-seed">S${seed}</span>` : '';
        return `<div class="qual-card q-apurado${isWc ? ' q-wildcard' : ''}" data-par="${escHtml(par)}">
          <div class="qual-row"><span class="qual-p1" title="${escHtml(p1)}">${escHtml(p1)}</span><span style="display:flex;align-items:center;gap:.3rem;flex-shrink:0">${seedHtml}<span class="qual-from">${v.group}</span></span></div>
          <div class="qual-row"><span class="qual-p2" title="${escHtml(p2||'')}">${escHtml(p2||'')}</span><span class="qual-badge-sm ${isWc ? 'badge-wc' : 'badge-ap'}">${isWc ? 'Wildcard' : 'Apurado'}</span></div>
        </div>`;
      }).join('');
      html += `<div class="section-heading sh-green"><i class="ph ph-trophy"></i> Já Apurados</div>
               <div class="qualified-grid">${cards}</div>`;
    } else {
      html += `<div class="qual-empty"><i class="ph ph-clock"></i> Nenhum par matematicamente apurado ainda.</div>`;
    }

    if (eliminados.length > 0) {
      const cards = eliminados.map(([par, v]) => {
        const [p1, p2] = par.split(' & ');
        return `<div class="qual-card q-eliminado" data-par="${escHtml(par)}">
          <div class="qual-row"><span class="qual-p1 elim" title="${escHtml(p1)}">${escHtml(p1)}</span><span class="qual-from">${v.group}</span></div>
          <div class="qual-row"><span class="qual-p2 elim" title="${escHtml(p2||'')}">${escHtml(p2||'')}</span><span class="qual-badge-sm badge-el">Eliminado</span></div>
        </div>`;
      }).join('');
      html += `<div class="section-heading sh-red" style="margin-top:1rem"><i class="ph ph-x-circle"></i> Já Eliminados</div>
               <div class="qualified-grid">${cards}</div>`;
    }
    return html;
  }

  // â”€â”€ Main render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  let activeTab = 'TODOS';

  function renderAll() {
    _scenCache = new Map();
    const jogos  = getData('jogos');
    const grupos = getData('grupos');

    // Progress bar
    const groupJogos = jogos.filter(j => !j._isFF);
    const totalJ = groupJogos.length;
    const doneJ  = groupJogos.filter(j => j.resultado).length;
    const pct    = totalJ > 0 ? Math.round(doneJ / totalJ * 100) : 0;
    document.getElementById('progDone').textContent  = doneJ;
    document.getElementById('progTotal').textContent = totalJ;
    document.getElementById('progressFill').style.width = pct + '%';
    const decidedGroups = grupos.filter(g => {
      const gJ   = groupJogos.filter(j => j.grupo === g.id);
      const rows = computeStandings(g, jogos);
      return isGroupDecided(rows, gJ.length);
    });
    const pgEl = document.getElementById('progGroups');
    if (pgEl) pgEl.textContent = decidedGroups.length + '/' + grupos.length + ' grupos decididos';

    // Tabs
    const tabsEl = document.getElementById('catTabs');
    tabsEl.innerHTML = ['TODOS', ...CATS].map(c =>
      `<button class="cat-tab${c===activeTab?' active':''}" data-cat="${c}" onclick="switchTab('${c}',this)">${c==='TODOS'?'Todos':c}</button>`
    ).join('');

    // Content
    const contentEl = document.getElementById('mainContent');
    let allHtml = '';

    // â”€â”€ TODOS section â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    {
      // Confirmed status across all cats
      const allConfirmed = new Map();
      const allSeedMap = new Map();
      CATS.forEach(cat => {
        const cMap = getConfirmedStatus(cat, grupos, jogos);
        cMap.forEach((v, k) => allConfirmed.set(k, { ...v, cat }));
        computeSeedMap(cat, grupos, jogos).forEach((s, k) => allSeedMap.set(k, s));
      });

      // Recent results — count from config
      const _sbCfg = (function(){ try{ return JSON.parse(localStorage.getItem('pp_config')||'null')||{}; }catch(e){return{};} })();
      const _recentCount = parseInt(_sbCfg.sbRecentCount)||16;
      const recent = [...groupJogos]
        .filter(j => j.resultado)
        .sort((a,b) => ((b.data||'')+(b.hora||'')).localeCompare((a.data||'')+(a.hora||'')))
        .slice(0, _recentCount);

      const recentHtml = recent.length > 0
        ? recent.map(j => {
            const r = j.resultado;
            let w1 = true;
            let setsHtml = '';
            if (r.wo) {
              w1 = r.wo !== 'eq1';
              setsHtml = `<span class="result-set-score">W/O</span>`;
            } else {
              const sets = [[r.s1eq1,r.s1eq2],[r.s2eq1,r.s2eq2],[r.s3eq1,r.s3eq2]].filter(([a,b])=>a!=null&&b!=null);
              const sv1 = sets.filter(([a,b])=>a>b).length, sv2 = sets.filter(([a,b])=>b>a).length;
              w1 = sv1 > sv2;
              setsHtml = sets.map(([a,b], si) => {
                const aw1 = a > b;
                return (si > 0 ? `<span class="result-set-sep">·</span>` : '') +
                  `<span class="result-set-score ${aw1?'':'losing'}">${a}</span>` +
                  `<span class="result-set-sep">-</span>` +
                  `<span class="result-set-score ${aw1?'losing':''}">${b}</span>`;
              }).join('');
            }
            return `<div class="result-row">
              <div class="result-left">
                <span class="result-team ${w1?'winner':'loser'} right">${escHtml(j.eq1).replace(' &amp; ','<br>')}</span>
              </div>
              <div class="result-center">
                <div class="result-sets">${setsHtml}</div>
                <span class="result-group-lbl">${escHtml(j.grupo)}</span>
              </div>
              <div class="result-right">
                <span class="result-team ${!w1?'winner':'loser'}">${escHtml(j.eq2).replace(' &amp; ','<br>')}</span>
              </div>
            </div>`;
          }).join('')
        : '';

      // Decisive pending games (at least one pair not yet confirmed qualified)
      const decisive = groupJogos.filter(j => {
        if (j.resultado) return false;
        const s1 = allConfirmed.get(j.eq1)?.status;
        const s2 = allConfirmed.get(j.eq2)?.status;
        return s1 !== 'qualified' || s2 !== 'qualified';
      });

      const decisiveHtml = decisive.length > 0
        ? decisive.map(j => {
            const t = (j.data ? j.data.slice(5).replace('-','/') : '') + (j.hora ? ' ' + j.hora : '');
            return `<div class="decisive-row">
              <span class="decisive-tag">${escHtml(j.grupo)}</span>
              <div class="decisive-match">
                <span class="decisive-eq right">${escHtml(j.eq1).replace(' &amp; ','<br>')}</span>
                <span class="decisive-vs">vs</span>
                <span class="decisive-eq">${escHtml(j.eq2).replace(' &amp; ','<br>')}</span>
              </div>
              ${j.campo?`<span class="decisive-field"><i class="ph ph-map-pin"></i> ${escHtml(j.campo)}</span>`:''}
              ${t?`<span class="decisive-time">${escHtml(t)}</span>`:''}
            </div>`;
          }).join('')
        : '';

      // Cat summary chips
      const catChipsHtml = CATS.map(cat => {
        const cMap = getConfirmedStatus(cat, grupos, jogos);
        const ap = [...cMap.values()].filter(v => v.status === 'qualified').length;
        const el = [...cMap.values()].filter(v => v.status === 'eliminated').length;
        const clr = CAT_CLR[cat] || '#8AA396';
        return `<span class="chip" style="background:${clr}22;color:${clr};border:1px solid ${clr}44">
          <span class="chip-dot" style="background:${clr}"></span>${cat}
          ${ap > 0 ? `<span style="opacity:.8;font-weight:400">${ap} ap</span>` : ''}
          ${el > 0 ? `<span style="opacity:.8;font-weight:400;color:var(--vermelho)">${el} el</span>` : ''}
        </span>`;
      }).join('');

      const statusHtml = buildStatusPanels(allConfirmed, allSeedMap);

      allHtml += `<div class="cat-section${activeTab==='TODOS'?' active':''}" id="cat-TODOS">
        <div class="cat-chips">${catChipsHtml}</div>
        <div class="section-heading"><i class="ph ph-shield-check"></i> Estado de Qualificação</div>
        ${statusHtml}
        ${recentHtml ? `<div class="section-heading" style="margin-top:1.25rem"><i class="ph ph-check-circle"></i> Últimos Resultados</div><div class="results-list">${recentHtml}</div>` : ''}
        ${decisiveHtml ? `<div class="section-heading"><i class="ph ph-fire"></i> Jogos Decisivos Pendentes</div><div class="decisive-list">${decisiveHtml}</div>` : ''}
        <div class="section-heading" style="margin-top:1.25rem"><i class="ph ph-list"></i> Todos os Grupos</div>
        <div class="groups-grid">${grupos.map(g => buildGroupCard(g, jogos, allConfirmed, grupos)).join('')}</div>
      </div>`;
    }

    // â”€â”€ Per-category sections â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    CATS.forEach(cat => {
      const catGrupos  = grupos.filter(g => g.cat === cat);
      const confirmedMap = getConfirmedStatus(cat, grupos, jogos);
      const apCount    = [...confirmedMap.values()].filter(v => v.status === 'qualified').length;
      const elCount    = [...confirmedMap.values()].filter(v => v.status === 'eliminated').length;
      const wcCount    = [...confirmedMap.values()].filter(v => v.status === 'contention_wc').length;
      const totalPairs = catGrupos.reduce((s, g) => s + computeStandings(g, jogos).length, 0);
      const disputa    = totalPairs - apCount - elCount;
      const clr        = CAT_CLR[cat] || '#8AA396';

      const chipsHtml  = `<div class="cat-chips">
        ${apCount > 0 ? `<span class="chip chip-verde"><span class="chip-dot" style="background:var(--verde)"></span>${apCount} Apurados</span>` : ''}
        ${elCount > 0 ? `<span class="chip" style="background:rgba(255,74,74,.12);color:var(--vermelho);border:1px solid rgba(255,74,74,.25)"><span class="chip-dot" style="background:var(--vermelho)"></span>${elCount} Eliminados</span>` : ''}
        ${disputa > 0 ? `<span class="chip chip-azul"><span class="chip-dot" style="background:var(--azul)"></span>${disputa} Em disputa</span>` : ''}
        ${wcCount > 0 ? `<span class="chip" style="background:rgba(245,197,24,.12);color:var(--amarelo);border:1px solid rgba(245,197,24,.25)"><span class="chip-dot" style="background:var(--amarelo)"></span>${wcCount} Poss. wildcard</span>` : ''}
      </div>`;

      const seedMap = computeSeedMap(cat, grupos, jogos);
      const statusHtml = buildStatusPanels(confirmedMap, seedMap);

      // Decisive games for this cat
      const catDecisive = groupJogos.filter(j => {
        if (j.resultado) return false;
        const jcat = j.grupo ? j.grupo.split('-')[0] : '';
        if (jcat !== cat) return false;
        const s1 = confirmedMap.get(j.eq1)?.status;
        const s2 = confirmedMap.get(j.eq2)?.status;
        return s1 !== 'qualified' || s2 !== 'qualified';
      });

      const decisiveHtml = catDecisive.length > 0
        ? `<div class="section-heading"><i class="ph ph-fire"></i> Jogos Decisivos</div>
           <div class="decisive-list">${catDecisive.map(j => {
              const t = (j.data ? j.data.slice(5).replace('-','/') : '') + (j.hora ? ' ' + j.hora : '');
              return `<div class="decisive-row">
                <span class="decisive-tag">${escHtml(j.grupo)}</span>
                <div class="decisive-match">
                  <span class="decisive-eq right">${escHtml(j.eq1).replace(' &amp; ','<br>')}</span>
                  <span class="decisive-vs">vs</span>
                  <span class="decisive-eq">${escHtml(j.eq2).replace(' &amp; ','<br>')}</span>
                </div>
                ${j.campo?`<span class="decisive-field"><i class="ph ph-map-pin"></i> ${escHtml(j.campo)}</span>`:''}
                ${t?`<span class="decisive-time">${escHtml(t)}</span>`:''}
              </div>`;
           }).join('')}</div>`
        : '';

      const groupsHtml = catGrupos.map(g => buildGroupCard(g, jogos, confirmedMap, grupos)).join('');

      allHtml += `<div class="cat-section${activeTab===cat?' active':''}" id="cat-${cat}">
        ${chipsHtml}
        ${statusHtml}
        ${decisiveHtml}
        <div class="section-heading" style="margin-top:1.25rem"><i class="ph ph-list"></i> Grupos</div>
        <div class="groups-grid">${groupsHtml || '<div class="empty-box">Sem grupos para esta categoria.</div>'}</div>
      </div>`;
    });

    contentEl.innerHTML = allHtml;
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('pt-PT');
    applyPairSearch();
  }

  // â”€â”€ Pesquisa "A minha dupla" â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  let _pairQuery = '';
  function _norm(s) { return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
  function onPairSearch(v) { _pairQuery = v; applyPairSearch(); }
  function clearPairSearch() {
    _pairQuery = '';
    const i = document.getElementById('pairSearch');
    if (i) { i.value = ''; i.focus(); }
    applyPairSearch();
  }
  function applyPairSearch() {
    const q = _norm(_pairQuery);
    document.querySelectorAll('.group-card.card-hit').forEach(c => c.classList.remove('card-hit'));
    let hits = 0;
    document.querySelectorAll('#mainContent [data-par]').forEach(n => {
      const isHit = !!q && _norm(n.getAttribute('data-par')).includes(q);
      n.classList.toggle('pair-hit', isHit);
      n.classList.toggle('search-dim', !!q && !isHit);
      if (isHit) { hits++; const gc = n.closest('.group-card'); if (gc) gc.classList.add('card-hit'); }
    });
    const cnt = document.getElementById('pairSearchCount');
    if (cnt) cnt.textContent = q ? (hits ? `${hits} ${hits===1?'resultado':'resultados'}` : 'sem resultados') : '';
    const clr = document.getElementById('pairSearchClear');
    if (clr) clr.style.display = q ? 'inline-flex' : 'none';
  }
  function goToTab(cat) {
    const btn = [...document.querySelectorAll('.cat-tab')].find(b => b.getAttribute('data-cat') === cat);
    if (btn) switchTab(cat, btn);
  }
  function jumpToPair() {
    const q = _norm(_pairQuery);
    if (!q) return;
    const active = document.querySelector('.cat-section.active');
    const matches = n => _norm(n.getAttribute('data-par')).includes(q);
    let target = active ? [...active.querySelectorAll('[data-par]')].find(matches) : null;
    if (!target) {
      const any = [...document.querySelectorAll('#mainContent [data-par]')].find(matches);
      if (any) {
        const sec = any.closest('.cat-section');
        if (sec) goToTab(sec.id.replace('cat-', ''));
        target = any;
      }
    }
    if (target) (target.closest('.group-card') || target).scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function switchTab(cat, btn) {
    activeTab = cat;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('active'));
    document.getElementById('cat-' + cat)?.classList.add('active');
  }

  // â”€â”€ 15-min auto-refresh â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  const _sbRefreshCfg = (function(){ try{ return JSON.parse(localStorage.getItem('pp_config')||'null')||{}; }catch(e){return{};} })();
  const REFRESH_SECS = (parseInt(_sbRefreshCfg.sbRefreshMins)||15) * 60;
  let countdown = REFRESH_SECS;
  const countEl = document.getElementById('refreshCountdown');
  function fmtCD(s) { const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
  function tick() {
    countdown--;
    if (countEl) countEl.textContent = fmtCD(countdown);
    if (countdown <= 0) { countdown = REFRESH_SECS; renderAll(); }
    setTimeout(tick, 1000);
  }
  function forceRefresh() { countdown = REFRESH_SECS; renderAll(); }

  // â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  renderAll();
  setTimeout(tick, 1000);
  window.addEventListener('pp:datasynced', function() { countdown = REFRESH_SECS; renderAll(); }, { once: true });

  // ── Auto-scroll para TV ────────────────────────────────────────────
  let _scrollActive = false;
  let _scrollRAF = null;
  let _scrollPos = 0;
  const _SCROLL_SPEED = 0.6;   // px por frame (~36px/s a 60fps)
  const _PAUSE_TOP    = 3000;  // ms pausa no topo antes de recomeçar
  const _PAUSE_BOT    = 1500;  // ms pausa no fundo antes de voltar ao topo

  function _scrollStep() {
    if (!_scrollActive) return;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    if (_scrollPos >= maxScroll) {
      // Chegou ao fundo — pausa, depois salta para o topo
      _scrollActive = false;
      setTimeout(function() {
        window.scrollTo({ top: 0, behavior: 'instant' });
        _scrollPos = 0;
        setTimeout(function() {
          _scrollActive = true;
          _scrollRAF = requestAnimationFrame(_scrollStep);
        }, _PAUSE_TOP);
      }, _PAUSE_BOT);
      return;
    }
    _scrollPos += _SCROLL_SPEED;
    window.scrollTo(0, _scrollPos);
    _scrollRAF = requestAnimationFrame(_scrollStep);
  }

  function toggleAutoScroll() {
    const btn  = document.getElementById('btnAutoScroll');
    const icon = document.getElementById('autoScrollIcon');
    _scrollActive = !_scrollActive;
    if (_scrollActive) {
      _scrollPos = window.scrollY;
      btn.style.color = 'var(--verde)';
      btn.style.borderColor = 'rgba(0,195,123,.4)';
      icon.className = 'ph ph-pause';
      _scrollRAF = requestAnimationFrame(_scrollStep);
    } else {
      if (_scrollRAF) cancelAnimationFrame(_scrollRAF);
      btn.style.color = '';
      btn.style.borderColor = '';
      icon.className = 'ph ph-play';
    }
  }
</script>
